name: Build Windows Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  EXIFTOOL_URL: https://github.com/leslievan/fastfiles/raw/refs/heads/main/exiftool/exiftool-13.45_64.zip
  PACKAGE_BASENAME: ExifFrame
  PLATFORM: win-x64

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: x64

    - name: Install build dependencies
      run: |
        python -m pip install -r build_support/requirements-windows.txt

    - name: Prepare ExifTool resources
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path build -Force | Out-Null
        Invoke-WebRequest -Uri "${{ env.EXIFTOOL_URL }}" -OutFile build/exiftool.zip
        Expand-Archive -Path build/exiftool.zip -DestinationPath build/exiftool-download
        $toolExe = Get-ChildItem -LiteralPath build/exiftool-download -File -Recurse |
            Where-Object { $_.Name -in @('exiftool.exe', 'exiftool(-k).exe') } |
            Select-Object -First 1
        if ($null -eq $toolExe) { throw 'ExifTool executable missing' }
        if (-not (Test-Path -LiteralPath (Join-Path $toolExe.Directory.FullName 'exiftool_files'))) {
            throw 'ExifTool runtime files missing'
        }
        New-Item -ItemType Directory -Path exiftool -Force | Out-Null
        Get-ChildItem -LiteralPath $toolExe.Directory.FullName -Force |
            Copy-Item -Destination exiftool -Recurse

    - name: Build single-file executable
      run: python build_support/build_windows.py

    - name: Verify executable resources and startup
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path build/ci-package-check/temp, build/ci-package-check/appdata | Out-Null
        $env:TEMP = (Resolve-Path build/ci-package-check/temp).Path
        $env:TMP = $env:TEMP
        $env:LOCALAPPDATA = (Resolve-Path build/ci-package-check/appdata).Path
        $executable = (Resolve-Path dist/single/ExifFrame.exe).Path
        $reportPath = Join-Path (Resolve-Path build/ci-package-check).Path 'report.json'
        $expected = @('resources', 'templates', 'fonts', 'persistence', 'translations',
                      'exiftool_read_write', 'heif_round_trip', 'render_and_export')
        foreach ($attempt in 1..2) {
          $process = Start-Process -FilePath $executable -ArgumentList @('--verify-package', "`"$reportPath`"") -WindowStyle Hidden -Wait -PassThru
          if (Test-Path -LiteralPath $reportPath) {
            $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          } else {
            throw "Package verification report missing on run $attempt"
          }
          if ($process.ExitCode -ne 0 -or -not $report.ok) {
            Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | Write-Host
            throw "Package verification failed on run $attempt"
          }
          foreach ($name in $expected) {
            if ($null -eq $report.checks.$name -or -not $report.checks.$name.ok) {
              throw "Package verification check missing or failed: $name"
            }
          }
          if ($attempt -eq 2 -and -not $report.checks.persistence.result.previous_run_verified) {
            throw 'User settings and template did not persist across launches'
          }
        }
        $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }

    - name: Determine artifact name
      id: artifact_name
      shell: pwsh
      run: |
        $tag = '${{ github.ref_name }}'
        if ($tag -match '^v') {
          $version = $tag -replace '^v', ''
        } else {
          $version = '${{ github.sha }}'.Substring(0, 7)
        }
        $artifact = "${{ env.PACKAGE_BASENAME }}-${version}-${{ env.PLATFORM }}"
        "artifact_name=${artifact}" >> $env:GITHUB_OUTPUT

    - name: Upload single-file artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.artifact_name }}
        path: dist/single/ExifFrame.exe
        if-no-files-found: error
