name: Build ExifFrame for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v2.1.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXIFTOOL_VERSION: '13.60'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
    - name: Resolve release source
      id: release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = $env:RELEASE_TAG
        if ($tag -cnotmatch '^v[0-9A-Za-z][0-9A-Za-z._+-]*$') {
          throw 'Release tag must start with v, for example v2.1.5'
        }
        git check-ref-format "refs/tags/$tag"
        if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }
        $response = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
        if ($LASTEXITCODE -ne 0) { throw 'Unable to read release tag' }
        $reference = $response | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" } | Select-Object -First 1
        $refSha = ''
        if ($null -ne $reference) {
          $refSha = $reference.object.sha
          $target = $reference.object
          while ($target.type -eq 'tag') {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read annotated tag' }
            $target = ($response | ConvertFrom-Json).object
          }
          if ($target.type -ne 'commit') { throw 'Release tag must point to a commit' }
          $commit = $target.sha
        } else {
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw "Release tag no longer exists: $tag" }
          $commit = $env:GITHUB_SHA
        }
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "commit=$commit" >> $env:GITHUB_OUTPUT
        "ref_sha=$refSha" >> $env:GITHUB_OUTPUT

    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ steps.release.outputs.commit }}
        persist-credentials: false

    - name: Cache ExifTool
      uses: actions/cache@v6.1.0
      with:
        path: exiftool
        key: ${{ runner.os }}-${{ runner.arch }}-exiftool-${{ env.EXIFTOOL_VERSION }}

    - name: Prepare ExifTool
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $exe = (Test-Path -LiteralPath 'exiftool/exiftool.exe' -PathType Leaf) -or
               (Test-Path -LiteralPath 'exiftool/exiftool(-k).exe' -PathType Leaf)
        $support = Test-Path -LiteralPath 'exiftool/exiftool_files' -PathType Container
        if ($exe -and $support) {
          Write-Host 'Using cached ExifTool'
          exit 0
        }
        $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
        $work = [IO.Path]::GetFullPath((Join-Path $runnerTemp ("exifframe-exiftool-" + [guid]::NewGuid().ToString('N'))))
        New-Item -ItemType Directory -Path $work | Out-Null
        $work = (Resolve-Path -LiteralPath $work).Path
        if ([IO.Path]::GetDirectoryName($work).TrimEnd('\', '/') -ne $runnerTemp.TrimEnd('\', '/')) {
          throw 'Invalid ExifTool temporary directory'
        }
        try {
          $archiveName = "exiftool-$($env:EXIFTOOL_VERSION)_64.zip"
          $archive = Join-Path $work $archiveName
          $unpacked = Join-Path $work 'unpacked'
          $uri = "https://downloads.sourceforge.net/project/exiftool/$archiveName"
          Invoke-WebRequest -Uri $uri -OutFile $archive -TimeoutSec 180
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $source = Join-Path $unpacked "exiftool-$($env:EXIFTOOL_VERSION)_64"
          if (-not ((Test-Path -LiteralPath (Join-Path $source 'exiftool(-k).exe') -PathType Leaf) -and
                    (Test-Path -LiteralPath (Join-Path $source 'exiftool_files') -PathType Container))) {
            throw 'Downloaded ExifTool is missing its executable or support directory'
          }
          New-Item -ItemType Directory -Path exiftool -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination exiftool -Recurse -Force
          if (Test-Path -LiteralPath 'exiftool/exiftool.exe' -PathType Leaf) {
            Copy-Item -LiteralPath (Join-Path $source 'exiftool(-k).exe') -Destination 'exiftool/exiftool.exe' -Force
          }
        } finally {
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
        }

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'
        architecture: x64
        cache: pip
        cache-dependency-path: build_support/requirements-windows.txt

    - name: Install build dependencies
      run: |
        python -m pip install -r build_support/requirements-windows.txt

    - name: Read NumPy wheel name
      id: build_config
      shell: pwsh
      run: |
        $wheel = python -c "from build_support.build_windows import NUMPY_WHEEL; print(NUMPY_WHEEL)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "numpy_wheel=$wheel" >> $env:GITHUB_OUTPUT

    - name: Cache NumPy wheel
      uses: actions/cache@v6.1.0
      with:
        path: build/download/${{ steps.build_config.outputs.numpy_wheel }}
        key: ${{ runner.os }}-numpy-${{ steps.build_config.outputs.numpy_wheel }}

    - name: Build single-file executable
      run: python build_support/build_windows.py

    - name: Check executable startup
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Remove-Item Env:EXIFFRAME_DATA_DIR -ErrorAction SilentlyContinue
        $executable = (Resolve-Path build/ExifFrame.exe).Path
        $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
        if (-not $process.WaitForExit(180000)) {
          $process.Kill($true)
          throw 'Smoke test timed out'
        }
        if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
        if (-not (Test-Path -LiteralPath build/config/config.ini)) {
          throw 'Default configuration was not created next to the executable'
        }

    - name: Publish GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        BUILD_COMMIT: ${{ steps.release.outputs.commit }}
        ORIGINAL_REF_SHA: ${{ steps.release.outputs.ref_sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        $tag = $env:RELEASE_TAG
        $repo = $env:GITHUB_REPOSITORY
        $response = gh api "repos/$repo/git/matching-refs/tags/$tag"
        if ($LASTEXITCODE -ne 0) { throw 'Unable to recheck release tag' }
        $reference = $response | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" } | Select-Object -First 1
        if ($env:ORIGINAL_REF_SHA) {
          if ($null -eq $reference -or $reference.object.sha -cne $env:ORIGINAL_REF_SHA) {
            throw 'Release tag changed during the build'
          }
        } else {
          if ($null -ne $reference) { throw 'Release tag appeared during the build; rerun the workflow' }
          gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:BUILD_COMMIT" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create release tag' }
        }
        $releaseTags = @(gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name')
        if ($LASTEXITCODE -ne 0) { throw 'Unable to list releases' }
        if ($releaseTags -ccontains $tag) {
          $response = gh release view $tag --repo $repo --json assets,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read existing release' }
          $release = $response | ConvertFrom-Json
          if (@($release.assets | Where-Object { $_.name -ceq 'ExifFrame.exe' }).Count -eq 0) {
            gh release upload $tag build/ExifFrame.exe --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Unable to upload ExifFrame.exe' }
          } else {
            Write-Host 'Keeping the existing ExifFrame.exe release asset'
          }
          $draft = $release.isDraft
        } else {
          gh release create $tag build/ExifFrame.exe --repo $repo --verify-tag --draft --title $tag --notes 'ExifFrame for Windows'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create draft release' }
          $draft = $true
        }
        if ($draft) {
          gh release edit $tag --repo $repo --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish release' }
        }
