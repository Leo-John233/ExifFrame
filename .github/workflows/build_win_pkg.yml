name: Build Windows Release Package

on:
  push:
    tags:
      - 'v*' # Push events to matching build* tags
  workflow_dispatch:

env:
  EXIFTOOL_URL: https://github.com/leslievan/fastfiles/raw/refs/heads/main/exiftool/exiftool-13.45_64.zip
  PACKAGE_BASENAME: ExifFrame
  PLATFORM: win-x64

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository source code into 'dist'
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable
      run: |
        python ./scripts/build_windows.py --no-resources

    - name: Prepare Package and Unpack ExifTool
      shell: pwsh
      run: |
        # 1. 设置脚本在遇到任何错误时立即停止，这是 CI/CD 的最佳实践
        $ErrorActionPreference = "Stop"

        # 2. 定义目标目录变量，便于维护
        $distPath = "./dist/ExifFrame"

        # 3. 批量移动文件和文件夹，代码更简洁
        Write-Host "Moving resources to $distPath"
        $itemsToMove = @("./config", "./static", "./pyproject.toml")
        Move-Item -Path $itemsToMove -Destination $distPath -Force

        # 4. 批量创建所需目录
        Write-Host "Creating subdirectories in $distPath"
        @("input", "output", "exiftool") | ForEach-Object {
            New-Item -Path (Join-Path $distPath $_) -ItemType Directory -Force | Out-Null
        }

        # 5. 下载并正确解压 ExifTool
        Write-Host "Downloading ExifTool..."
        $zipFile = "exiftool.zip"
        $exiftoolDestPath = Join-Path $distPath "exiftool"

        Invoke-WebRequest -Uri "${{ env.EXIFTOOL_URL }}" -OutFile $zipFile

        Write-Host "Expanding ExifTool archive..."
        Expand-Archive -Path $zipFile -DestinationPath $exiftoolDestPath -Force

        # 以程序所在目录识别外层包装，保留 exiftool_files 的内部结构
        $resourceRoot = (Resolve-Path -LiteralPath $exiftoolDestPath).Path
        $toolExe = Get-ChildItem -LiteralPath $resourceRoot -File -Recurse |
            Where-Object { $_.Name -in @("exiftool.exe", "exiftool(-k).exe") } |
            Select-Object -First 1
        if ($null -eq $toolExe) { throw "ExifTool executable missing" }
        $toolRoot = $toolExe.Directory.FullName
        if ($toolRoot -ne $resourceRoot) {
            if (-not $toolRoot.StartsWith($resourceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
                throw "ExifTool package path outside resource directory"
            }
            Get-ChildItem -LiteralPath $toolRoot -Force | Move-Item -Destination $resourceRoot -Force
        }
        if ($toolExe.Name -eq "exiftool(-k).exe") {
            Rename-Item -LiteralPath (Join-Path $resourceRoot "exiftool(-k).exe") -NewName "exiftool.exe"
        }
        if (-not (Test-Path -LiteralPath (Join-Path $resourceRoot "exiftool_files"))) {
            throw "ExifTool runtime files missing"
        }

        Write-Host "Setup complete."

    - name: Determine Artifact Name
      id: artifact_name
      shell: pwsh
      run: |
        $TAG="${{ github.ref_name }}"
        
        if ($TAG -match '^v') {
          $CLEAN_TAG = $TAG -replace '^v', ''
        } else {
          $CLEAN_TAG = "${{ github.sha }}".Substring(0, 7)
        }
        
        $ARTIFACT_NAME="${{ env.PACKAGE_BASENAME }}-${CLEAN_TAG}-${{ env.PLATFORM }}"
        echo "Generated Artifact Name: ${ARTIFACT_NAME}"
        echo "artifact_name=${ARTIFACT_NAME}" >> $env:GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.artifact_name }}
        path: dist/ExifFrame
