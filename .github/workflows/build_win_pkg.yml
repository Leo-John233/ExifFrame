name: Build Windows Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKAGE_BASENAME: ExifFrame
  PLATFORM: win-x64

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: x64

    - name: Check local ExifTool
      shell: pwsh
      run: |
        if (-not ((Test-Path -LiteralPath 'exiftool/exiftool.exe' -PathType Leaf) -or
                  (Test-Path -LiteralPath 'exiftool/exiftool(-k).exe' -PathType Leaf))) {
          throw 'Provide exiftool/exiftool.exe before building'
        }
        if (-not (Test-Path -LiteralPath 'exiftool/exiftool_files' -PathType Container)) {
          throw 'Provide the adjacent exiftool/exiftool_files directory before building'
        }

    - name: Install build dependencies
      run: |
        python -m pip install -r build_support/requirements-windows.txt

    - name: Cache downloaded dependencies
      uses: actions/cache@v4
      with:
        path: build/download/numpy-2.5.2-cp313-cp313-win_amd64.whl
        key: ${{ runner.os }}-numpy-wheel-py313-${{ hashFiles('build_support/build_windows.py') }}
        restore-keys: ${{ runner.os }}-numpy-wheel-py313-

    - name: Build single-file executable
      run: python build_support/build_windows.py

    - name: Check executable startup
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Remove-Item Env:EXIFFRAME_DATA_DIR -ErrorAction SilentlyContinue
        $executable = (Resolve-Path build/ExifFrame.exe).Path
        $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
        if (-not $process.WaitForExit(180000)) {
          $process.Kill($true)
          throw 'Smoke test timed out'
        }
        if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
        if (-not (Test-Path -LiteralPath build/config/config.ini)) {
          throw 'Default configuration was not created next to the executable'
        }

    - name: Determine artifact name
      id: artifact_name
      shell: pwsh
      run: |
        $tag = '${{ github.ref_name }}'
        if ($tag -match '^v') {
          $version = $tag -replace '^v', ''
        } else {
          $version = '${{ github.sha }}'.Substring(0, 7)
        }
        $artifact = "${{ env.PACKAGE_BASENAME }}-${version}-${{ env.PLATFORM }}"
        "artifact_name=${artifact}" >> $env:GITHUB_OUTPUT

    - name: Upload single-file artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.artifact_name }}
        path: build/ExifFrame.exe
        if-no-files-found: error
